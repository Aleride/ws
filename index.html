<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="图片.jpg" type="image/jpeg">
<title>HiMusic</title>
<style>
    body {
        background-color: #008080;
        font-family: "Microsoft Sans Serif", "Tahoma", "Arial", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: #000;
        user-select: none;
    }
    .window {
        width: 520px;
        background-color: #c0c0c0;
        border-top: 2px solid #ffffff;
        border-left: 2px solid #ffffff;
        border-right: 2px solid #404040;
        border-bottom: 2px solid #404040;
        box-shadow: 1px 1px 0 0 #000;
        padding: 2px;
    }
    .title-bar {
        background: linear-gradient(90deg, #000080, #1084d0);
        color: #fff;
        padding: 4px 5px;
        font-weight: bold;
        font-size: 14px;
        display: flex;
        align-items: center;
    }
    .content { padding: 15px; }
    .screen {
        background-color: #000;
        font-family: "Courier New", Courier, monospace;
        padding: 10px;
        border-top: 2px solid #404040;
        border-left: 2px solid #404040;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        margin-bottom: 15px;
        font-size: 16px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        user-select: text;
    }
    #track-info {
        color: #ffffff;
        text-shadow: 0 0 3px rgba(255, 255, 255, 0.6);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 8px;
    }
    .time-row { display: flex; justify-content: space-between; align-items: center; }
    #time-info, #system-time {
        color: #ffffff;
        text-shadow: 0 0 2px rgba(255, 255, 255, 0.5);
        font-size: 14px;
    }
    .progress-bar {
        width: 100%;
        -webkit-appearance: none;
        height: 10px;
        background: #fff;
        border-top: 2px solid #404040;
        border-left: 2px solid #404040;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        outline: none;
        cursor: pointer;
        margin-bottom: 15px;
    }
    .progress-bar::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 12px; height: 22px;
        background: #c0c0c0;
        border-top: 2px solid #ffffff;
        border-left: 2px solid #ffffff;
        border-right: 2px solid #404040;
        border-bottom: 2px solid #404040;
        cursor: pointer;
    }
    .playlist-container {
        background-color: #fff;
        border-top: 2px solid #404040;
        border-left: 2px solid #404040;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
        height: 200px;
        overflow-y: scroll;
        margin-bottom: 15px;
        font-size: 14px;
        user-select: text;
    }
    .playlist-container::-webkit-scrollbar { width: 16px; }
    .playlist-container::-webkit-scrollbar-track { background: #dfdfdf; border-left: 1px solid #404040; }
    .playlist-container::-webkit-scrollbar-thumb {
        background: #c0c0c0;
        border-top: 2px solid #ffffff;
        border-left: 2px solid #ffffff;
        border-right: 2px solid #404040;
        border-bottom: 2px solid #404040;
    }
    .playlist-item {
        padding: 4px 5px;
        cursor: pointer;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        border-bottom: 1px dotted #dfdfdf;
    }
    .playlist-item:hover { background-color: #000080; color: #fff; }
    .playlist-item.active { background-color: #000080; color: #fff; }
    .controls { display: flex; justify-content: space-between; margin-bottom: 15px; }
    .btn {
        background-color: #c0c0c0;
        border-top: 2px solid #ffffff;
        border-left: 2px solid #ffffff;
        border-right: 2px solid #404040;
        border-bottom: 2px solid #404040;
        padding: 5px 15px;
        font-family: inherit;
        font-size: 14px;
        cursor: pointer;
        outline: none;
    }
    .btn:active, .btn.pressed {
        border-top: 2px solid #404040;
        border-left: 2px solid #404040;
        border-right: 2px solid #ffffff;
        border-bottom: 2px solid #ffffff;
    }
    button:focus, input[type="range"]:focus, input[type="radio"]:focus {
        outline: 1px dotted #000;
        outline-offset: -4px;
    }
    .mode-container {
        display: flex; gap: 15px; align-items: center; font-size: 14px; margin-top: 5px;
    }
    input[type="radio"] { margin: 0 5px 0 0; transform: translateY(1px); }
    .status-bar {
        background-color: #c0c0c0;
        border-top: 1px solid #404040;
        border-left: 1px solid #404040;
        border-right: 1px solid #ffffff;
        border-bottom: 1px solid #ffffff;
        padding: 3px 8px;
        font-size: 12px;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-family: "Courier New", Courier, monospace;
        letter-spacing: 0.5px;
    }
</style>

const audio = document.getElementById('audio');
const playlistEl = document.getElementById('playlist');
const trackInfo = document.getElementById('track-info');
const timeInfo = document.getElementById('time-info');
const systemTime = document.getElementById('system-time');
const progressBar = document.getElementById('progress');
const playBtn = document.getElementById('play-btn');
const pauseBtn = document.getElementById('pause-btn');

let currentIndex = -1;
let isPlaying = false;

function formatTime(seconds) {
    if (isNaN(seconds)) return "00:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function updateSystemTime() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    systemTime.textContent = `${y}-${m}-${d} ${h}:${min}:${s}`;
}
setInterval(updateSystemTime, 1000);
updateSystemTime();

function loadSong(index) {
    if (index < 0 || index >= songs.length) return;
    const isSameSong = (index === currentIndex);
    currentIndex = index;
    const song = songs[index];
    if (!isSameSong) {
        audio.src = song.file; 
    } else {
        audio.currentTime = 0;
    }
    trackInfo.textContent = song.name;
    timeInfo.textContent = "00:00 / 00:00";
    document.querySelectorAll('.playlist-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
        if(i === index) el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    });
}

function playSong() {
    if (currentIndex === -1) loadSong(0);
    audio.play().catch(e => {});
    isPlaying = true;
    playBtn.classList.add('pressed');
    pauseBtn.classList.remove('pressed');
}

function pauseSong() {
    audio.pause();
    isPlaying = false;
    playBtn.classList.remove('pressed');
    pauseBtn.classList.add('pressed');
}

function stopSong() {
    audio.pause();
    audio.currentTime = 0;
    audio.src = "";
    trackInfo.textContent = "未加载曲目...";
    timeInfo.textContent = "00:00 / 00:00";
    isPlaying = false;
    playBtn.classList.remove('pressed');
    pauseBtn.classList.remove('pressed');
    currentIndex = -1;
    document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
}

function prevSong() {
    let index = currentIndex - 1;
    if (index < 0) index = songs.length - 1;
    loadSong(index);
    playSong();
}

function nextSong() {
    const mode = document.querySelector('input[name="mode"]:checked').value;
    let index = currentIndex + 1;
    if (mode === 'shuffle') {
        index = Math.floor(Math.random() * songs.length);
    } else if (mode === 'single') {
        index = currentIndex;
    } else { 
        if (index >= songs.length) index = 0;
    }
    loadSong(index);
    playSong();
}

audio.addEventListener('error', () => {
    if (currentIndex !== -1) {
        trackInfo.textContent = "无法播放: " + songs[currentIndex].name;
    }
});

audio.addEventListener('ended', nextSong);

audio.addEventListener('timeupdate', () => {
    if (!isNaN(audio.duration)) {
        const progress = (audio.currentTime / audio.duration) * 100;
        progressBar.value = progress;
        timeInfo.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    }
});

progressBar.addEventListener('input', () => {
    if (!isNaN(audio.duration)) {
        const seekTime = (progressBar.value / 100) * audio.duration;
        audio.currentTime = seekTime;
    }
});

playBtn.addEventListener('click', playSong);
pauseBtn.addEventListener('click', pauseSong);
document.getElementById('stop-btn').addEventListener('click', stopSong);
document.getElementById('prev-btn').addEventListener('click', prevSong);
document.getElementById('next-btn').addEventListener('click', nextSong);

function initPlaylist() {
    songs.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = 'playlist-item';
        item.textContent = `${index + 1}. ${song.name}`;
        item.addEventListener('click', () => {
            loadSong(index);
            playSong();
        });
        playlistEl.appendChild(item);
    });
}

initPlaylist();
</script>
</body>
</html>
