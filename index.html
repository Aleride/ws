    * { box-sizing: border-box; }

    .window { width: 720px; height: 600px; max-height: calc(100vh - 30px); margin: auto; border-radius: 9px; box-shadow: 0 25px 70px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,0,0,0.4); overflow: hidden; display: flex; flex-direction: column; background: #c8c8c8; }
    .metal { background: repeating-linear-gradient(0deg, rgba(255,255,255,0.09) 0 1px, rgba(0,0,0,0.04) 1px 2px), linear-gradient(to bottom, #e3e3e3, #cfcfcf 55%, #c2c2c2); border-bottom: 1px solid #8f8f8f; padding: 6px 12px 10px 12px; position: relative; flex-shrink: 0; }
    .lights { position: absolute; top: 8px; left: 10px; display: flex; gap: 7px; }
    .light { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.35); box-shadow: inset 0 1px 1px rgba(255,255,255,0.7), inset 0 -2px 3px rgba(0,0,0,0.2); }
    .l-r { background: radial-gradient(circle at 35% 30%, #ffb3ad, #ff5f57 60%, #e0443e); }
    .l-y { background: radial-gradient(circle at 35% 30%, #ffe8b0, #ffbd2e 60%, #e0a020); }
    .l-g { background: radial-gradient(circle at 35% 30%, #b6f0a8, #28c840 60%, #1fa832); }
    .win-title { text-align: center; font-size: 12px; font-weight: bold; color: #222; text-shadow: 0 1px 0 rgba(255,255,255,0.7); padding-top: 2px; }
    .ctrl-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .transport { display: flex; align-items: center; gap: 6px; }
    .t-btn { width: 27px; height: 27px; border-radius: 50%; border: 1px solid #6f6f6f; cursor: pointer; background: radial-gradient(circle at 50% 20%, #ffffff 0%, #e8e8e8 35%, #c6c6c6 70%, #b5b5b5 100%); box-shadow: 0 1px 2px rgba(0,0,0,0.35), inset 0 -3px 5px rgba(0,0,0,0.15); color: #333; font-size: 9px; line-height: 1; display: flex; align-items: center; justify-content: center; }
    .t-btn:active { background: radial-gradient(circle at 50% 30%, #cfcfcf, #a8a8a8); box-shadow: inset 0 2px 4px rgba(0,0,0,0.4); }
    #play-btn { width: 32px; height: 32px; font-size: 11px; }
    .lcd { flex: 1; height: 56px; border-radius: 4px; border: 1px solid #4a4a4a; background: linear-gradient(to bottom, #9dc0ee 0%, #6d9ade 45%, #4a7ccc 55%, #3f6fc0 100%); box-shadow: inset 0 2px 6px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.5); padding: 6px 10px; color: #fff; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    .lcd-top { display: flex; justify-content: space-between; align-items: center; }
    #track-info { font-size: 13px; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lcd-right { display: flex; align-items: center; flex-shrink: 0; margin-left: 8px; gap: 8px; }
    #play-state { font-size: 10px; opacity: 0.9; }
    .eq { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
    .eq span { width: 3px; height: 30%; background: #fff; opacity: 0.9; animation: eq 0.9s ease-in-out infinite; animation-play-state: paused; }
    .eq span:nth-child(1){ animation-delay: 0s; } .eq span:nth-child(2){ animation-delay: .15s; } .eq span:nth-child(3){ animation-delay: .3s; } .eq span:nth-child(4){ animation-delay: .45s; } .eq span:nth-child(5){ animation-delay: .6s; }
    .lcd.playing .eq span { animation-play-state: running; }
    @keyframes eq { 0%,100% { height: 20%; } 50% { height: 100%; } }
    .lcd-bottom { display: flex; align-items: center; gap: 8px; font-size: 10px; font-family: "Courier New", monospace; text-shadow: 0 1px 1px rgba(0,0,0,0.4); }
    .vol-box { display: flex; align-items: center; gap: 6px; width: 120px; }
    .vol-label { font-size: 10px; color: #444; }
    input.aqua { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 5px; background: #fff; border: 1px solid #767676; box-shadow: inset 0 1px 3px rgba(0,0,0,0.3); outline: none; cursor: pointer; }
    #progress { flex: 1; } #volume { width: 90px; }
    input.aqua::-webkit-slider-thumb { -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 50% 22%, #eaf5ff 0%, #8cbaf5 40%, #2f6fd8 75%, #1b4fa8 100%); border: 1px solid #1d4c9c; box-shadow: inset 0 -2px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.4); }
    input.aqua::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 50% 22%, #eaf5ff 0%, #8cbaf5 40%, #2f6fd8 75%, #1b4fa8 100%); border: 1px solid #1d4c9c; }
    .row2 { display: flex; align-items: center; justify-content: space-between; margin-top: 9px; }
    .seg { display: flex; }
    .seg button { font-family: inherit; font-size: 11px; color: #222; padding: 3px 12px; cursor: pointer; margin-left: -1px; border: 1px solid #7f7f7f; background: linear-gradient(to bottom, #fefefe, #e2e2e2 45%, #d0d0d0 50%, #dedede); box-shadow: 0 1px 1px rgba(0,0,0,0.2); }
    .seg button:first-child { border-radius: 11px 0 0 11px; margin-left: 0; }
    .seg button:last-child { border-radius: 0 11px 11px 0; }
    .seg button.active { position: relative; z-index: 1; color: #fff; border-color: #2a56a6; background: linear-gradient(to bottom, #84b6f4, #4a8ae4 45%, #2f6fd8 50%, #4a8ae4); text-shadow: 0 -1px 0 rgba(0,0,0,0.35); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3); }
    .search { position: relative; }
    .search input { width: 160px; height: 20px; border-radius: 11px; border: 1px solid #7f7f7f; padding: 2px 8px 2px 24px; font-size: 11px; font-family: inherit; background: #fff; box-shadow: inset 0 1px 3px rgba(0,0,0,0.25); outline: none; }
    .search::before { content: ""; position: absolute; left: 9px; top: 5px; width: 7px; height: 7px; border: 2px solid #888; border-radius: 50%; }
    .search::after { content: ""; position: absolute; left: 16px; top: 13px; width: 5px; height: 2px; background: #888; transform: rotate(45deg); }
    .list-area { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #fff; }
    .list-header { display: flex; font-size: 11px; color: #333; background: linear-gradient(to bottom, #fbfbfb, #e8e8e8 50%, #dcdcdc 51%, #cfcfcf); border-bottom: 1px solid #9a9a9a; text-shadow: 0 1px 0 rgba(255,255,255,0.7); flex-shrink: 0; }
    .list-header .col { padding: 3px 8px; border-right: 1px solid #c2c2c2; }
    .playlist { flex: 1; overflow-y: auto; background: #fff; user-select: text; }
    .playlist::-webkit-scrollbar { width: 11px; }
    .playlist::-webkit-scrollbar-track { background: #f2f2f2; border-left: 1px solid #ddd; }
    .playlist::-webkit-scrollbar-thumb { background: #c5c5c5; border-radius: 6px; border: 2px solid #f2f2f2; }
    .playlist::-webkit-scrollbar-thumb:hover { background: #a9a9a9; }
    .row { display: flex; align-items: center; font-size: 12px; color: #000; padding: 2px 0; cursor: default; }
    .row.stripe { background: #f0f6fd; }
    .row:hover { background: #e4f0fc; }
    .row.active { background: linear-gradient(to bottom, #6ba1ea, #3875d7 50%, #2a63c9 51%, #3875d7); color: #fff; text-shadow: 0 -1px 0 rgba(0,0,0,0.25); }
    .c-num { width: 30px; text-align: right; padding-right: 8px; opacity: 0.65; flex-shrink: 0; }
    .c-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 8px; }
    .c-time { width: 56px; text-align: right; padding-right: 10px; opacity: 0.8; flex-shrink: 0; }
    .status-bar { height: 22px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 11px; color: #444; background: linear-gradient(to bottom, #e6e6e6, #d2d2d2); border-top: 1px solid #9a9a9a; text-shadow: 0 1px 0 rgba(255,255,255,0.6); flex-shrink: 0; gap: 12px; }
    .status-bar .quote { font-style: italic; color: #666; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #system-time { font-family: "Courier New", monospace; flex-shrink: 0; }
</style>

<div class="window">
    <div class="metal">
        <div class="lights"><div class="light l-r"></div><div class="light l-y"></div><div class="light l-g"></div></div>
        <div class="win-title">iTunes</div>
        <div class="ctrl-row">
            <div class="transport">
                <button class="t-btn" id="prev-btn" title="上一首 (←)">◀◀</button>
                <button class="t-btn" id="play-btn" title="播放/暂停 (空格)">▶</button>
                <button class="t-btn" id="next-btn" title="下一首 (→)">▶▶</button>
            </div>
            <div class="lcd" id="lcd">
                <div class="lcd-top">
                    <div id="track-info">未加载曲目...</div>
                    <div class="lcd-right">
                        <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
                        <div id="play-state">已停止</div>
                    </div>
                </div>
                <div class="lcd-bottom">
                    <span id="time-info">00:00</span>
                    <input type="range" class="aqua" id="progress" value="0" min="0" max="100">
                    <span id="total-info">--:--</span>
                </div>
            </div>
            <div class="vol-box">
                <span class="vol-label">音量</span>
                <input type="range" class="aqua" id="volume" value="90" min="0" max="100">
            </div>
        </div>
        <div class="row2">
            <div class="seg">
                <button data-mode="list" class="active">列表循环</button>
                <button data-mode="single">单曲循环</button>
                <button data-mode="shuffle">随机播放</button>
            </div>
            <div class="search"><input type="text" id="search" placeholder="搜索音乐"></div>
        </div>
    </div>
    <div class="list-area">
        <div class="list-header">
            <div class="col" style="width:30px; text-align:right;">#</div>
            <div class="col" style="flex:1;">名称</div>
            <div class="col" style="width:56px; text-align:right; border-right:none;">时间</div>
        </div>
        <div class="playlist" id="playlist"></div>
    </div>
    <div class="status-bar">
        <span id="status-info">0 首歌曲</span>
        <span class="quote">Across the Great Wall, we can reach every corner in the world.</span>
        <span id="system-time">YYYY/MM/DD HH:MM:SS</span>
    </div>
</div>

<audio id="audio"></audio>

const audio = document.getElementById('audio');
const playlistEl = document.getElementById('playlist');
const trackInfo = document.getElementById('track-info');
const playState = document.getElementById('play-state');
const timeInfo = document.getElementById('time-info');
const totalInfo = document.getElementById('total-info');
const systemTime = document.getElementById('system-time');
const progressBar = document.getElementById('progress');
const volumeBar = document.getElementById('volume');
const playBtn = document.getElementById('play-btn');
const searchEl = document.getElementById('search');
const statusInfo = document.getElementById('status-info');
const lcdEl = document.getElementById('lcd');

let currentIndex = -1;
let isPlaying = false;
let playMode = 'list';
let errorStreak = 0;
const rowEls = [];
const timeCells = [];

audio.volume = 0.9;

function formatTime(seconds) {
    if (isNaN(seconds)) return "00:00";
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
}

function formatTotal(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.round((sec % 3600) / 60);
    return h > 0 ? `${h} 小时 ${m} 分钟` : `${m} 分钟`;
}

function updateSystemTime() {
    const now = new Date();
    const y = now.getFullYear();
    const m = String(now.getMonth() + 1).padStart(2, '0');
    const d = String(now.getDate()).padStart(2, '0');
    const h = String(now.getHours()).padStart(2, '0');
    const min = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    systemTime.textContent = `${y}/${m}/${d} ${h}:${min}:${s}`;
}
setInterval(updateSystemTime, 1000);
updateSystemTime();

function applyStripes() {
    let vis = 0;
    rowEls.forEach(el => {
        if (el.style.display === 'none') return;
        el.classList.toggle('stripe', vis % 2 === 1);
        vis++;
    });
}

function loadSong(index) {
    if (index < 0 || index >= songs.length) return;
    const isSameSong = (index === currentIndex);
    currentIndex = index;
    const song = songs[index];
    if (!isSameSong) { audio.src = song.file; } else { audio.currentTime = 0; }
    trackInfo.textContent = song.name;
    timeInfo.textContent = "00:00";
    totalInfo.textContent = song.d ? formatTime(song.d) : "--:--";
    rowEls.forEach((el, i) => el.classList.toggle('active', i === index));
    if (rowEls[index]) rowEls[index].scrollIntoView({ block: 'nearest' });
}

function playSong() {
    if (currentIndex === -1) loadSong(0);
    audio.play().catch(e => {});
    isPlaying = true;
    playBtn.textContent = "II";
    playState.textContent = "正在播放";
    lcdEl.classList.add('playing');
}

function pauseSong() {
    audio.pause();
    isPlaying = false;
    playBtn.textContent = "▶";
    playState.textContent = "已暂停";
    lcdEl.classList.remove('playing');
}

function togglePlay() { if (isPlaying) pauseSong(); else playSong(); }

function prevSong() {
    let index = currentIndex - 1;
    if (index < 0) index = songs.length - 1;
    loadSong(index); playSong();
}

function nextSong() {
    let index = currentIndex + 1;
    if (playMode === 'shuffle') { index = Math.floor(Math.random() * songs.length); }
    else if (playMode === 'single') { index = currentIndex; }
    else { if (index >= songs.length) index = 0; }
    loadSong(index); playSong();
}

document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') {
        e.preventDefault();
        if (document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.blur();
        togglePlay();
    } else if (e.key === 'ArrowRight') { nextSong(); }
    else if (e.key === 'ArrowLeft') { prevSong(); }
});

document.querySelectorAll('.seg button').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.seg button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        playMode = btn.dataset.mode;
    });
});

searchEl.addEventListener('input', () => {
    const q = searchEl.value.trim().toLowerCase();
    rowEls.forEach((el, i) => { el.style.display = songs[i].name.toLowerCase().includes(q) ? 'flex' : 'none'; });
    applyStripes();
});

volumeBar.addEventListener('input', () => { audio.volume = volumeBar.value / 100; });

audio.addEventListener('error', () => {
    if (currentIndex === -1) return;
    trackInfo.textContent = "无法播放: " + songs[currentIndex].name;
    playState.textContent = "错误";
    lcdEl.classList.remove('playing');
    errorStreak++;
    if (errorStreak < songs.length) { setTimeout(nextSong, 800); }
    else { isPlaying = false; playBtn.textContent = "▶"; }
});

audio.addEventListener('ended', nextSong);

audio.addEventListener('loadedmetadata', () => { errorStreak = 0; });

audio.addEventListener('timeupdate', () => {
    if (!isNaN(audio.duration)) {
        progressBar.value = (audio.currentTime / audio.duration) * 100;
        timeInfo.textContent = formatTime(audio.currentTime);
    }
});

progressBar.addEventListener('input', () => {
    if (!isNaN(audio.duration)) { audio.currentTime = (progressBar.value / 100) * audio.duration; }
});

document.getElementById('prev-btn').addEventListener('click', prevSong);
document.getElementById('next-btn').addEventListener('click', nextSong);
playBtn.addEventListener('click', togglePlay);

function initPlaylist() {
    let total = 0;
    songs.forEach((song, index) => {
        const row = document.createElement('div');
        row.className = 'row';
        const num = document.createElement('div'); num.className = 'c-num'; num.textContent = index + 1;
        const name = document.createElement('div'); name.className = 'c-name'; name.textContent = song.name;
        const time = document.createElement('div'); time.className = 'c-time'; time.textContent = song.d ? formatTime(song.d) : "--:--";
        row.appendChild(num); row.appendChild(name); row.appendChild(time);
        row.addEventListener('click', () => { loadSong(index); playSong(); });
        rowEls.push(row); timeCells.push(time); playlistEl.appendChild(row);
        total += (song.d || 0);
    });
    applyStripes();
    statusInfo.textContent = `${songs.length} 首歌曲, ${formatTotal(total)}`;
}

initPlaylist();
</script>
