<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1, user-scalable=no">
<meta name="theme-color" id="metaTheme" content="#f7f9f4">
<title>暖声 · Warm Sound</title>
<link rel="icon" href="./图片.jpeg" type="image/jpeg">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#f7f9f4 0%,#ecf1e7 100%);
    font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","微软雅黑",sans-serif;
    overflow-x:hidden;overflow-y:auto;padding:24px 0;transition:background .8s;touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;}
  body.night{background:linear-gradient(180deg,#1e1309,#0f0903)}
  button,input{-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none;}
  #themeToggle{position:fixed;top:14px;right:14px;width:40px;height:40px;border:none;background:transparent;
    border-radius:50%;cursor:pointer;z-index:99;display:flex;align-items:center;justify-content:center;
    color:#5a6455;transition:color .5s,background .3s}
  #themeToggle:hover,#themeToggle:active{background:rgba(128,128,128,.12)}
  body.night #themeToggle{color:#c9a96e}
  body.night #themeToggle:hover,body.night #themeToggle:active{background:rgba(201,169,110,.1)}
  .t-icon{position:relative;width:17px;height:17px;display:block}
  .t-core{position:absolute;inset:0;border-radius:50%;border:1.5px solid currentColor;transition:all .45s ease}
  .t-rays{position:absolute;inset:0;transition:all .45s ease}
  .t-rays i{position:absolute;left:50%;top:50%;width:1.5px;height:3px;background:currentColor;border-radius:1px;
    transform:translate(-50%,-50%) rotate(var(--a)) translateY(-11.5px)}
  body.night .t-core{border-color:transparent;box-shadow:inset 5px -3px 0 0 currentColor;transform:rotate(-25deg) scale(1.05)}
  body.night .t-rays{opacity:0;transform:scale(.4)}
  .stage{display:grid;grid-template-areas:"header" "scene" "panel";grid-template-columns:minmax(0,1fr);
    width:min(460px,100%);padding:32px 22px 22px;transition:all .8s}
  body.night .stage{background:
      repeating-linear-gradient(87deg,transparent,transparent 3px,rgba(0,0,0,.06) 3px,rgba(0,0,0,.06) 4px),
      linear-gradient(160deg,#5d4037 0%,#3e2723 100%);
    border-radius:18px;box-shadow:0 2px 0 #795548 inset,0 -2px 0 #2a1a12 inset,0 20px 60px rgba(0,0,0,.7)}
  header{grid-area:header;text-align:center;margin-bottom:20px}
  header h1{font-family:"楷体","KaiTi","STKaiti","Songti SC","STSong","宋体","SimSun",serif;font-size:clamp(20px,6vw,30px);font-weight:900;color:#2b3128;
    letter-spacing:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .8s}
  header .sub{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-top:8px;color:#8a9484;transition:color .8s}
  .brand-cn{font-family:"楷体","KaiTi","STKaiti","Songti SC","STSong","宋体","SimSun",serif;font-weight:700;font-size:13px;letter-spacing:5px}
  .brand-en{font-size:10px;letter-spacing:3px;opacity:.75}
  header .date,header .gz,header .sc{font-size:11px;color:#7a8a72;margin-top:4px;letter-spacing:1px;transition:color .8s}
  header .date{color:#a2ab9c;margin-top:6px;font-variant-numeric:tabular-nums}
  body.night header h1{color:#c9a96e;text-shadow:0 1px 2px rgba(0,0,0,.5)}
  body.night header .sub{color:#8d7348}
  body.night header .date{color:#7a6540}
  body.night header .gz,body.night header .sc{color:#96794c}
  .sc-info{margin-top:12px;transition:color .8s}
  .sc-line1{display:flex;justify-content:center;align-items:baseline;gap:8px;flex-wrap:wrap}
  .sc-name{font-family:"楷体","KaiTi","STKaiti","Songti SC","STSong","宋体","SimSun",serif;font-size:17px;font-weight:900;color:#2b3128;letter-spacing:2px;transition:color .8s}
  .sc-range{font-size:10px;color:#a2ab9c;letter-spacing:1px;font-variant-numeric:tabular-nums;transition:color .8s}
  .sc-mer{font-size:10px;color:#a2ab9c;letter-spacing:1px;transition:color .8s}
  .sc-func{margin-top:5px;font-size:11px;color:#5d7a5a;letter-spacing:1px;transition:color .8s}
  .sc-yiji{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;font-size:11px;flex-wrap:wrap}
  .sc-yiji .yi,.sc-yiji .ji{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0}
  .sc-yiji .yi{background:#b3342e}
  .sc-yiji .ji{background:#3a3a3a}
  .sc-yiji em{font-style:normal;color:#8a6a3a;letter-spacing:1px;transition:color .8s}
  .sc-yiji .divider{width:1px;height:12px;background:rgba(93,122,90,.25)}
  .sc-desc{margin-top:8px;font-size:11px;line-height:1.8;color:#6b756b;text-align:justify;transition:color .8s}
  body.night .sc-name{color:#c9a96e}
  body.night .sc-range,body.night .sc-mer{color:#7a6540}
  body.night .sc-func{color:#96794c}
  body.night .sc-yiji em{color:#c9a96e}
  body.night .sc-yiji .divider{background:rgba(201,169,110,.25)}
  body.night .sc-desc{color:#8d7348}
  .scene{grid-area:scene;position:relative;height:clamp(300px,58vw,400px)}
  .panel{grid-area:panel}
  .floor{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:96%;height:44px;
    background:radial-gradient(ellipse at center,rgba(70,90,70,.12),transparent 70%);transition:all .8s}
  body.night .floor{background:radial-gradient(ellipse at center,rgba(0,0,0,.55),transparent 70%)}
  .album-art{position:absolute;left:50%;bottom:118px;transform:translateX(-88%);
    width:clamp(120px,40vw,185px);aspect-ratio:185/225;background:linear-gradient(160deg,#e9eee4,#d8e0d2);
    box-shadow:0 12px 30px rgba(80,95,80,.14);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:10px;z-index:1;transition:opacity .6s}
  .album-art .char{writing-mode:vertical-rl;font-family:"楷体","KaiTi","STKaiti","Songti SC","STSong","宋体","SimSun",serif;font-size:clamp(30px,10vw,52px);
    font-weight:900;color:#2c322c;letter-spacing:6px}
  .album-art .seal{width:16px;height:16px;background:#b3342e;border-radius:3px;opacity:.85}
  .dustcover{position:absolute;left:50%;bottom:116px;transform:translateX(-46%) skewX(-3deg);
    width:clamp(200px,66%,300px);height:clamp(150px,44vw,200px);z-index:2;border-radius:6px;
    background:linear-gradient(105deg,rgba(255,255,255,.55),rgba(230,236,228,.25) 55%,rgba(255,255,255,.5));
    border:1.5px solid rgba(180,192,180,.55);box-shadow:inset 0 6px 18px rgba(140,160,140,.08);transition:opacity .6s}
  .prop-book{position:absolute;left:2%;bottom:112px;width:86px;height:16px;background:linear-gradient(#e3ebe0,#ccd8c8);
    border-radius:2px;z-index:1;box-shadow:0 3px 6px rgba(0,0,0,.08);transition:filter .8s}
  body.night .prop-book{filter:brightness(.45) sepia(.4)}
  .incense{position:absolute;left:6%;bottom:120px;width:30px;height:30px;z-index:1;transition:opacity .6s}
  .incense .bowl{position:absolute;bottom:0;width:30px;height:14px;background:linear-gradient(#a9bfa9,#7f9b82);
    border-radius:4px 4px 10px 10px;box-shadow:0 3px 6px rgba(60,80,60,.15)}
  .incense .stick{position:absolute;bottom:12px;left:14px;width:2px;height:12px;background:#6b4a2b}
  .incense .smoke{position:absolute;bottom:24px;left:13px;width:2px;height:20px;border-radius:2px;
    background:linear-gradient(rgba(120,140,120,0),rgba(120,140,120,.45));filter:blur(1px);
    animation:rise 3.2s ease-in-out infinite}
  @keyframes rise{0%{transform:translateY(6px) scaleY(.7);opacity:0}40%{opacity:.8}100%{transform:translateY(-14px) scaleY(1.15);opacity:0}}
  .bamboo{position:absolute;right:3%;bottom:116px;width:44px;height:86px;z-index:1;transition:opacity .6s}
  .bamboo .vase2{position:absolute;bottom:0;left:7px;width:30px;height:44px;background:linear-gradient(#d3dfcc,#a9bfa0);
    border-radius:8px 8px 12px 12px;box-shadow:0 4px 8px rgba(60,80,60,.12)}
  .bamboo .stem2{position:absolute;bottom:42px;left:20px;width:2px;height:40px;background:#5d7a5a}
  .bamboo .leaf{position:absolute;width:18px;height:6px;background:#6f8f6a;border-radius:60% 40% 60% 40%}
  .l1{left:4px;top:14px;transform:rotate(-32deg)} .l2{left:22px;top:6px;transform:rotate(24deg)}
  .l3{left:2px;top:30px;transform:rotate(-18deg)} .l4{left:24px;top:24px;transform:rotate(38deg)}
  body.night .incense,body.night .bamboo,body.night .album-art,body.night .dustcover{opacity:0;pointer-events:none}
  .lamp{position:absolute;left:4%;bottom:122px;width:60px;height:122px;z-index:1;opacity:0;transition:opacity .8s}
  .lamp .glow{position:absolute;top:2px;left:-52px;width:160px;height:160px;
    background:radial-gradient(circle,rgba(255,178,74,.22),transparent 68%);pointer-events:none;
    animation:breathe 3.4s ease-in-out infinite}
  .lamp .shade{position:absolute;top:0;left:8px;width:44px;height:26px;background:linear-gradient(#8a5a2b,#63401c);
    border-radius:50% 50% 10px 10px/70% 70% 10px 10px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
  .lamp .bulb{position:absolute;top:22px;left:22px;width:16px;height:13px;border-radius:50%;
    background:radial-gradient(#ffe9b0,#ffb84d);box-shadow:0 0 16px 5px rgba(255,170,60,.5);
    animation:breathe 3.4s ease-in-out infinite}
  .lamp .stem{position:absolute;top:26px;left:28px;width:4px;height:80px;background:linear-gradient(#7a5a33,#4a3418)}
  .lamp .base{position:absolute;bottom:0;left:14px;width:32px;height:8px;border-radius:4px;background:#4a3418}
  @keyframes breathe{50%{opacity:.7}}
  .tea{position:absolute;right:5%;bottom:122px;width:36px;height:40px;z-index:1;opacity:0;transition:opacity .8s}
  .tea .cup{position:absolute;bottom:0;width:34px;height:16px;background:linear-gradient(#efe6d2,#c9b998);
    border-radius:4px 4px 12px 12px;box-shadow:0 3px 6px rgba(0,0,0,.3)}
  .tea .cup::after{content:'';position:absolute;top:2px;left:4px;right:4px;height:4px;border-radius:50%;
    background:radial-gradient(#8a5a2b,#5f3c1a)}
  .tea .steam{position:absolute;bottom:18px;left:10px;width:2px;height:16px;border-radius:2px;
    background:linear-gradient(rgba(255,244,220,0),rgba(255,244,220,.5));filter:blur(1px);
    animation:rise 2.8s ease-in-out infinite}
  .tea .steam.s2{left:20px;animation-delay:1.3s}
  body.night .lamp,body.night .tea{opacity:1}
  .deck{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:clamp(250px,94%,330px);height:96px;
    z-index:3;border-radius:8px;background:linear-gradient(180deg,#fcfdfb,#e9ede6);
    box-shadow:0 18px 40px rgba(70,90,70,.16),inset 0 2px 0 #fff,inset 0 -3px 0 #d3dcd2;transition:all .8s}
  body.night .deck{background:
      repeating-linear-gradient(87deg,transparent,transparent 3px,rgba(0,0,0,.08) 3px,rgba(0,0,0,.08) 4px),
      linear-gradient(180deg,#6d4c41,#4e342e);
    box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 2px 0 #795548,inset 0 -3px 0 #2a1a12}
  .knob{position:absolute;right:7%;top:34px;width:34px;height:34px;border-radius:50%;
    background:conic-gradient(#e9eaee,#b9bac2,#e9eaee,#b9bac2,#e9eaee);
    box-shadow:0 3px 6px rgba(0,0,0,.15),inset 0 1px 0 #fff}
  .knob::after{content:'';position:absolute;left:50%;top:4px;width:2px;height:10px;background:#7c7d85;transform:translateX(-50%)}
  .switches{position:absolute;left:7%;top:40px;display:flex;gap:10px}
  .switches i{width:16px;height:12px;background:linear-gradient(#fff,#dcdde2);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .deck-line{position:absolute;left:7%;top:24px;width:60px;height:2px;background:#d8ddd6}
  body.night .deck-line{background:rgba(201,169,110,.3)}
  body.night .switches i{background:linear-gradient(#8d6e63,#5d4037)}
  body.night .knob{background:conic-gradient(#d4a76a,#8d7348,#d4a76a,#8d7348,#d4a76a)}
  body.night .knob::after{background:#3e2723}
  .platter{position:absolute;left:50%;bottom:102px;transform:translateX(-58%);perspective:1000px;z-index:3}
  .vinyl{width:clamp(150px,52vw,225px);aspect-ratio:1;border-radius:50%;transform:rotateX(36deg);
    background:
      repeating-radial-gradient(circle,rgba(255,255,255,.045) 0 1.5px,transparent 1.5px 5px),
      conic-gradient(rgba(255,255,255,.10),transparent 25%,rgba(255,255,255,.06) 50%,transparent 75%,rgba(255,255,255,.10)),
      radial-gradient(circle,#2a2a2a 0 30%,#141414 31% 100%);
    box-shadow:0 14px 30px rgba(20,20,30,.35)}
  .vinyl.spinning{animation:spin 4s linear infinite}
  @keyframes spin{from{transform:rotateX(36deg) rotateZ(0)}to{transform:rotateX(36deg) rotateZ(360deg)}}
  .label{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38%;height:38%;border-radius:50%;
    background:radial-gradient(circle,#efece4,#e0dccf);display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px rgba(0,0,0,.15);transition:background .8s}
  .label span{font-family:"楷体","KaiTi","STKaiti","Songti SC","STSong","宋体","SimSun",serif;font-size:clamp(20px,7vw,30px);font-weight:900;color:#3a3a3a}
  .label::after{content:'';position:absolute;right:22%;bottom:20%;width:9px;height:9px;background:#b3342e;border-radius:2px;opacity:.8}
  body.night .label{background:radial-gradient(circle,#d4a76a,#b8884a)}
  body.night .label span{color:#2a1a12}
  .arm-pivot{position:absolute;right:13%;bottom:158px;width:22px;height:22px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#f8f8fa,#9fa0a8);z-index:4;box-shadow:0 3px 6px rgba(0,0,0,.2)}
  .arm{position:absolute;right:calc(13% + 8px);bottom:56px;width:5px;height:112px;border-radius:3px;
    background:linear-gradient(180deg,#c9cad1,#84858d);transform-origin:top center;
    transform:rotate(14deg);transition:transform 1s ease;z-index:4}
  .arm.playing{transform:rotate(27deg)}
  .arm-head{position:absolute;left:-4px;bottom:-4px;width:13px;height:16px;background:#3c3d43;border-radius:2px}
  .arm-head::after{content:'';position:absolute;left:3px;bottom:-3px;width:7px;height:4px;background:#c96a2a}
  .controls,.utility,.progress{user-select:none;-webkit-user-select:none}
  .controls{display:flex;align-items:center;justify-content:center;gap:34px;margin-top:6px}
  .main{width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;background:#fff;color:#2f3a2c;
    font-size:20px;letter-spacing:1px;box-shadow:0 8px 22px rgba(70,90,70,.14);transition:all .2s}
  .main:active{transform:scale(.9);box-shadow:0 4px 10px rgba(70,90,70,.1)}
  .side{width:44px;height:44px;border-radius:50%;border:none;background:transparent;color:#9aa49a;
    font-size:16px;cursor:pointer;transition:all .2s}
  .side:active{transform:scale(.85);color:#2f3a2c}
  body.night .main{background:transparent;border:1px solid #8d7348;color:#c9a96e;box-shadow:none}
  body.night .main:active{background:#c9a96e;color:#3e2723}
  body.night .side{color:#8d7348}
  body.night .side:active{color:#c9a96e}
  .utility{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
  .mode-btn{font-size:11px;letter-spacing:1px;padding:6px 14px;border-radius:999px;border:1px solid #cfd8ca;
    color:#5d7a5a;background:transparent;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
  .mode-btn:active{transform:scale(.92);background:rgba(93,122,90,.15)}
  body.night .mode-btn{border-color:#8d7348;color:#c9a96e}
  body.night .mode-btn:active{background:rgba(201,169,110,.15)}
  .counter{font-size:10px;color:#a2ab9c;letter-spacing:1px;font-variant-numeric:tabular-nums;transition:color .8s}
  body.night .counter{color:#7a6540}
  .vol{display:flex;align-items:center;gap:6px}
  .vol-btn{border:none;background:transparent;color:#5d7a5a;font-size:13px;cursor:pointer;transition:all .2s}
  .vol-btn:active{transform:scale(.85)}
  .vol-btn.muted{opacity:.4;text-decoration:line-through}
  body.night .vol-btn{color:#c9a96e}
  .vol input[type=range]{width:70px;height:4px;-webkit-appearance:none;background:rgba(93,122,90,.25);border-radius:2px;outline:none}
  .vol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#5d7a5a;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.1)}
  body.night .vol input[type=range]{background:rgba(201,169,110,.25)}
  body.night .vol input[type=range]::-webkit-slider-thumb{background:#c9a96e}
  .progress{display:flex;align-items:center;gap:10px;margin-top:14px;position:relative;padding:10px 0}
  .progress span{font-size:11px;color:#9aa49a;min-width:34px;font-variant-numeric:tabular-nums;transition:color .8s}
  .bar{flex:1;height:6px;background:#dde5d8;border-radius:3px;cursor:pointer;transition:background .8s;touch-action:none;position:relative}
  .fill{height:100%;width:0;background:#5d7a5a;border-radius:3px;transition:background .8s;pointer-events:none}
  body.night .progress span{color:#8d7348}
  body.night .bar{background:rgba(201,169,110,.2)}
  body.night .fill{background:#c9a96e}
  .pl-panel{margin-top:18px;max-height:35vh;overflow-y:auto;overflow-x:hidden;background:rgba(255,255,255,0.4);border-radius:12px;
    box-shadow:inset 0 0 0 1px rgba(93,122,90,.1);padding:6px;transition:all .8s;-webkit-overflow-scrolling:touch}
  .pl-panel::-webkit-scrollbar{width:4px}
  .pl-panel::-webkit-scrollbar-thumb{background:#cfd8ca;border-radius:2px}
  .pl-item{padding:12px 14px;font-size:13px;color:#87917f;cursor:pointer;border-radius:8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .2s;border-bottom:1px solid rgba(93,122,90,.05)}
  .pl-item:active{transform:scale(.98);background:#e9f0e4}
  .pl-item.active{color:#22301f;font-weight:700;background:#e9f0e4}
  body.night .pl-panel{background:rgba(0,0,0,.2);box-shadow:inset 0 0 0 1px rgba(201,169,110,.1)}
  body.night .pl-panel::-webkit-scrollbar-thumb{background:#5d4037}
  body.night .pl-item{color:rgba(201,169,110,.6);border-bottom-color:rgba(201,169,110,.05)}
  body.night .pl-item:active{color:#c9a96e;background:rgba(201,169,110,.08)}
  body.night .pl-item.active{color:#c9a96e;font-weight:700;background:rgba(201,169,110,.12)}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
    background:rgba(30,26,20,.9);color:#f5f0e6;font-size:13px;padding:10px 20px;border-radius:999px;
    opacity:0;pointer-events:none;transition:all .3s;z-index:100;letter-spacing:1px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (orientation:landscape) and (min-width:700px){
    .stage{grid-template-areas:"scene header" "scene panel";
      grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);grid-template-rows:auto 1fr;
      gap:0 56px;width:min(1020px,96vw);padding:40px 56px;align-items:start}
    header{text-align:left;margin-bottom:20px;padding-top:8px}
    header .sub{justify-content:flex-start}
    header h1{font-size:clamp(24px,3vw,34px)}
    .sc-line1,.sc-yiji{justify-content:flex-start}
    .scene{height:clamp(320px,62vh,470px)}
    .vinyl{width:clamp(170px,28vh,245px)}
    .deck{width:clamp(280px,80%,360px)}
    .controls{justify-content:flex-start;gap:26px}
    .pl-panel{max-height:clamp(140px,30vh,260px)}
  }
  @media (max-width:520px){
    .stage{padding:24px 14px 18px}
    .scene{height:340px}
    .deck{height:86px}
    .platter{bottom:92px}
    .arm{height:96px;bottom:52px}
    .arm-pivot{bottom:140px}
    .prop-book,.incense,.bamboo,.lamp,.tea{display:none}
    .main{width:62px;height:62px}
    .vol input[type=range]{width:56px}
  }
  @media (max-width:380px){
    .scene{height:300px}
    .album-art{display:none}
  }
</style>
</head>
<body>

<button id="themeToggle" aria-label="切换昼夜模式" title="单击手动切换 · 双击恢复自动">

/* ===== 播放器核心（先启动，保证永远可用） ===== */
const audio=new Audio();let currentIndex=-1,isPlaying=false,errStreak=0;
const $=id=>document.getElementById(id);
const vinyl=$('vinyl'),arm=$('arm'),vinylChar=$('vinylChar'),artChar=$('artChar');
const trackName=$('trackName'),playBtn=$('playBtn'),prevBtn=$('prevBtn'),nextBtn=$('nextBtn');
const bar=$('bar'),fill=$('fill'),curTime=$('curTime'),durTime=$('durTime');
const plList=$('plList');
const modeBtn=$('modeBtn'),counter=$('counter'),volBtn=$('volBtn'),volSlider=$('volSlider');

function updateTitle(){
  document.title=(isPlaying?'▶ ':'')+(currentIndex>-1?SONGS[currentIndex].name+' · ':'')+BRAND_CN+' · '+BRAND_EN;
}

const MODES=['list','single','random'];
const MODE_TXT={list:'列表循环',single:'单曲循环',random:'随机播放'};
let mode=MODES.includes(lsGet('ns_mode'))?lsGet('ns_mode'):'list';
function applyMode(){modeBtn.textContent=MODE_TXT[mode];lsSet('ns_mode',mode)}
modeBtn.onclick=()=>{mode=MODES[(MODES.indexOf(mode)+1)%3];applyMode();toast('播放模式 · '+MODE_TXT[mode])};
applyMode();

let muted=lsGet('ns_muted')==='1';
const savedVol=parseFloat(lsGet('ns_vol'));
audio.volume=isNaN(savedVol)?0.8:Math.min(1,Math.max(0,savedVol));
volSlider.value=audio.volume;
function applyVol(){audio.muted=muted;volBtn.classList.toggle('muted',muted);lsSet('ns_muted',muted?'1':'0')}
function setVol(v){audio.volume=Math.min(1,Math.max(0,v));volSlider.value=audio.volume;lsSet('ns_vol',String(audio.volume));muted=false;applyVol()}
volSlider.oninput=()=>setVol(parseFloat(volSlider.value));
volBtn.onclick=()=>{muted=!muted;applyVol();toast(muted?'已静音':'已取消静音')};
applyVol();

function fmt(s){if(isNaN(s))return'0:00';return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function setPlaying(s){
  isPlaying=s;
  vinyl.classList.toggle('spinning',s);arm.classList.toggle('playing',s);playBtn.textContent=s?'❚❚':'▶';
  if('mediaSession' in navigator){try{navigator.mediaSession.playbackState=s?'playing':'paused'}catch(e){}}
  updateTitle();
}
function loadSong(i){
  if(i<0||i>=SONGS.length)return;
  currentIndex=i;const s=SONGS[i];audio.src=s.file;lsSet('ns_last',String(i));
  trackName.textContent=s.name;trackName.title=s.name;
  vinylChar.textContent=(s.name||'♫')[0];artChar.textContent=(s.name||'音')[0];

function play(){if(currentIndex===-1)loadSong(0);audio.play().catch(()=>{});setPlaying(true)}
function pause(){audio.pause();setPlaying(false)}
function nextIndex(){
  if(mode==='random'){let r;do{r=Math.floor(Math.random()*SONGS.length)}while(SONGS.length>1&&r===currentIndex);return r}
  let i=currentIndex+1;if(i>=SONGS.length)i=0;return i;
}
function next(){loadSong(nextIndex());play()}
function prev(){let i=currentIndex-1;if(i<0)i=SONGS.length-1;loadSong(i);play()}

audio.addEventListener('play',()=>setPlaying(true));
audio.addEventListener('pause',()=>{if(!audio.ended)setPlaying(false)});

audio.addEventListener('ended',()=>{if(mode==='single'){audio.currentTime=0;audio.play()}else next();});
audio.addEventListener('error',()=>{
  if(currentIndex===-1)return;errStreak++;
  if(errStreak>=SONGS.length){pause();toast('多个文件缺失，已停止');return}
  toast('「'+SONGS[currentIndex].name+'」缺失，已跳过');next();
});

function getSeekRatio(e){const r=bar.getBoundingClientRect();const clientX=e.touches?e.touches[0].clientX:e.clientX;return Math.min(1,Math.max(0,(clientX-r.left)/r.width))}
function seekStart(e){e.preventDefault();const ratio=getSeekRatio(e);if(!isNaN(audio.duration)){audio.currentTime=ratio*audio.duration;fill.style.width=(ratio*100)+'%'}}
function seekMove(e){const ratio=getSeekRatio(e);if(!isNaN(audio.duration)){audio.currentTime=ratio*audio.duration;fill.style.width=(ratio*100)+'%'}}
bar.addEventListener('mousedown',seekStart);
bar.addEventListener('touchstart',seekStart,{passive:false});
document.addEventListener('mousemove',(e)=>{if(e.buttons===1)seekMove(e)});

playBtn.onclick=()=>{isPlaying?pause():play()};
prevBtn.onclick=prev;nextBtn.onclick=next;

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();isPlaying?pause():play();}
  else if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
  else if(e.key==='ArrowUp'){e.preventDefault();setVol(audio.volume+0.1)}

  else if(e.key==='x'||e.key==='X')modeBtn.onclick();
});

function lLeapMonth(y){return LUNAR[y-1900]&0xf}
function lLeapDays(y){return lLeapMonth(y)?((LUNAR[y-1900]&0x10000)?30:29):0}

function solar2lunar(y,m,d){if(y<1900||y>2049)return null;let offset=Math.floor((new Date(y,m-1,d)-new Date(1900,0,31))/86400000);let temp=0,lY=1900;for(;lY<2050&&offset>0;lY++){temp=lYearDays(lY);offset-=temp}if(offset<0){offset+=temp;lY--}const leap=lLeapMonth(lY);let isLeap=false,lM=1;for(;lM<13&&offset>0;lM++){if(leap>0&&lM===leap+1&&!isLeap){--lM;isLeap=true;temp=lLeapDays(lY)}else temp=lMonthDays(lY,lM);if(isLeap&&lM===leap+1)isLeap=false;offset-=temp;}if(offset===0&&leap>0&&lM===leap+1){if(isLeap)isLeap=false;else{isLeap=true;--lM}}if(offset<0){offset+=temp;--lM}return {lM,lD:offset+1,isLeap};}

function jdn(y,m,d){const a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;}
function termsOfYear(y){const Y=y%100,L=Math.floor(Y/4),r=[];
  for(let i=0;i<24;i++)r.push({i,m:Math.floor(i/2)+1,d:Math.floor(Y*0.2422+TERM_C[i])-L});
  return r;}
function gz(s,b){return GAN[s]+ZHI[b]}
function calcGZ(){
  const n=new Date(),y=n.getFullYear(),mo=n.getMonth()+1,d=n.getDate(),h=n.getHours();
  const today=new Date(y,mo-1,d);
  const all=[];
  [y-1,y,y+1].forEach(yy=>termsOfYear(yy).forEach(t=>all.push({t,dt:new Date(yy,t.m-1,t.d)})));
  all.sort((a,b)=>a.dt-b.dt);
  const lcF=all.find(x=>x.dt.getFullYear()===y&&x.t.i===2);
  const lc=lcF?lcF.dt:today;
  const gy=today<lc?y-1:y;
  const yS=((gy-4)%10+10)%10,yB=((gy-4)%12+12)%12;
  const jie=all.filter(x=>x.t.i%2===0&&x.dt<=today);
  const lastJie=jie.length?jie[jie.length-1]:null;
  const mB=lastJie?(JIE_BRANCH[lastJie.t.i]||0):0;
  const mS=([2,4,6,8,0][yS%5]+((mB-2)+12)%12)%10;
  const di=(jdn(y,mo,d)+49)%60,dS=di%10;
  const hb=Math.floor(((h+1)%24)/2);
  const hS=([0,2,4,6,8][dS%5]+hb)%10;
  let termText='';
  const exact=all.find(x=>x.dt.getTime()===today.getTime());
  if(exact){termText='今日·'+TERMS[exact.t.i];}
  else{
    const past=all.filter(x=>x.dt<today);
    const lp=past.length?past[past.length-1]:null;
    if(lp)termText=TERMS[lp.t.i]+'后'+Math.round((today-lp.dt)/86400000)+'日';
  }
  return gz(yS,yB)+'年 '+gz(mS,mB)+'月 '+gz(dS,di%12)+'日 '+gz(hS,hB)+'时 · '+termText;
}
function calcSC(){const h=new Date().getHours();const hb=Math.floor(((h+1)%24)/2);const cz=(h%2===0)?'正':'初';return '时辰 · '+ZHI[hb]+cz+' · '+SC_RANGE[hb];}
